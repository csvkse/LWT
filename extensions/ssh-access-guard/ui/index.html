<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH 访问安全卫士 - 自治控制台</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1e293b;
      --border-glow: #06b6d4;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --cyan: #06b6d4;
      --cyan-dim: rgba(6, 182, 212, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .title-box { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 15px; font-weight: 600; color: #fff; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
      font-family: monospace;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--cyan); color: #fff; }
    .btn-primary { background: #0891b2; border-color: #06b6d4; color: #fff; }
    .btn-primary:hover { background: #06b6d4; }
    .btn-danger { background: rgba(244, 63, 94, 0.2); border-color: #f43f5e; color: #fda4af; }
    .btn-danger:hover { background: #f43f5e; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 20px; font-weight: 700; font-family: monospace; }
    .stat-val.cyan { color: var(--cyan); }
    .stat-val.red { color: var(--red); }
    .stat-val.green { color: var(--green); }

    .grid-panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .grid-panels { grid-template-columns: 1fr 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .table th, .table td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid #1e293b;
    }
    .table th { color: var(--text-muted); font-size: 11px; }
    .table tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .input {
      flex: 1;
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .input:focus { outline: none; border-color: var(--cyan); }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <span style="font-size: 18px;">🛡️</span>
      <span class="title">SSH 访问安全卫士</span>
      <span class="badge">非 HTTP 脚本前端自治扩展</span>
    </div>
    <button class="btn" id="btn-refresh">🔄 刷新数据</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">🟢 当前在线 SSH 会话</div>
      <div class="stat-val green" id="stat-active">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🚫 已封禁黑名单总数</div>
      <div class="stat-val red" id="stat-banned">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⚙️ 守卫监控状态</div>
      <div class="stat-val cyan" id="stat-status">探测中...</div>
    </div>
  </div>

  <div class="grid-panels">
    <!-- 封禁管理面板 -->
    <div class="panel">
      <div class="panel-header">
        <span>⛔ 快速封禁 / 解封 IP</span>
      </div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
        将恶意爆破 SSH 密码的 IP 写入 <code style="color: #67e8f9;">/etc/hosts.deny</code> 进行拦截。
      </p>
      <div class="input-group">
        <input type="text" id="target-ip" class="input" placeholder="输入 IP 或网段，如 192.168.1.100">
        <button class="btn btn-danger" id="btn-ban">一键封禁</button>
        <button class="btn" id="btn-unban">一键解封</button>
      </div>

      <div style="margin-top: 16px;">
        <div class="panel-header" style="font-size: 12px; margin-bottom: 6px;">
          <span>🚫 当前封禁黑名单</span>
        </div>
        <div style="max-height: 180px; overflow-y: auto;">
          <table class="table">
            <thead>
              <tr><th>封禁目标 IP</th><th>操作</th></tr>
            </thead>
            <tbody id="banned-tbody">
              <tr><td colspan="2" style="text-align: center; color: var(--text-muted);">暂无封禁记录</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 登录审计记录 -->
    <div class="panel">
      <div class="panel-header">
        <span>📜 最近 SSH 登录轨迹审计</span>
      </div>
      <div style="max-height: 300px; overflow-y: auto;">
        <table class="table">
          <thead>
            <tr><th>用户</th><th>来源 IP</th><th>状态</th><th>时间</th></tr>
          </thead>
          <tbody id="records-tbody">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const EXT_ID = 'ssh-access-guard';

    // 泛化 HostBridge 通信驱动（优先 postMessage，降级 fetch 宿主接口）
    const HostBridge = {
      async callAction(action, params = {}) {
        const payload = { extensionId: EXT_ID, action: action, actionParams: params };
        const res = await fetch('/api/Services/Extensions/Action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return await res.json();
      }
    };

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.borderColor = isError ? 'var(--red)' : 'var(--cyan)';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    async function loadAll() {
      // 1. 刷新状态
      try {
        const res = await HostBridge.callAction('status');
        if (res.data?.data) {
          const d = res.data.data;
          document.getElementById('stat-active').innerText = d.activeCount != null ? d.activeCount : '1';
          document.getElementById('stat-banned').innerText = d.bannedCount != null ? d.bannedCount : '0';
          document.getElementById('stat-status').innerText = d.status || 'Active';
        }
      } catch (e) {
        document.getElementById('stat-status').innerText = '离线';
      }

      // 2. 刷新黑名单
      try {
        const resBan = await HostBridge.callAction('banned_list');
        const tb = document.getElementById('banned-tbody');
        tb.innerHTML = '';
        const list = Array.isArray(resBan.data?.data) ? resBan.data.data : [];
        if (list.length === 0) {
          tb.innerHTML = '<tr><td colspan="2" style="text-align: center; color: var(--text-muted);">暂无封禁记录</td></tr>';
        } else {
          list.forEach(ip => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td style="font-family: monospace; color: #fda4af;">${ip}</td><td><button class="btn btn-danger" style="padding: 2px 6px; font-size: 11px;" onclick="unbanSpecific('${ip}')">解封</button></td>`;
            tb.appendChild(tr);
          });
        }
      } catch (e) {}

      // 3. 刷新登录记录
      try {
        const resRec = await HostBridge.callAction('records');
        const tb = document.getElementById('records-tbody');
        tb.innerHTML = '';
        const list = Array.isArray(resRec.data?.data) ? resRec.data.data : [];
        if (list.length === 0) {
          tb.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">暂无审计记录</td></tr>';
        } else {
          list.forEach(r => {
            const tr = document.createElement('tr');
            const isSucc = r.status === 'success' || r.status === 'Accepted';
            tr.innerHTML = `
              <td>${r.user || '-'}</td>
              <td style="font-family: monospace;">${r.ip || '-'}</td>
              <td><span class="badge" style="border-color: ${isSucc ? 'var(--green)' : 'var(--red)'}; color: ${isSucc ? 'var(--green)' : 'var(--red)'}; background: ${isSucc ? 'var(--green-dim)' : 'var(--red-dim)'};">${r.status || 'success'}</span></td>
              <td style="color: var(--text-muted); font-size: 11px;">${r.time || '-'}</td>
            `;
            tb.appendChild(tr);
          });
        }
      } catch (e) {}
    }

    async function banIp() {
      const ip = document.getElementById('target-ip').value.trim();
      if (!ip) { showToast('请输入要封禁的 IP', true); return; }
      const res = await HostBridge.callAction('ban_ip', { ip });
      if (res.data?.success) {
        showToast('封禁成功');
        document.getElementById('target-ip').value = '';
        loadAll();
      } else {
        showToast(res.data?.message || res.message || '封禁失败', true);
      }
    }

    async function unbanSpecific(ip) {
      const res = await HostBridge.callAction('unban_ip', { ip });
      if (res.data?.success) {
        showToast(`已成功解封 ${ip}`);
        loadAll();
      } else {
        showToast('解封失败', true);
      }
    }

    async function unbanInput() {
      const ip = document.getElementById('target-ip').value.trim();
      if (!ip) { showToast('请输入要解封的 IP', true); return; }
      await unbanSpecific(ip);
      document.getElementById('target-ip').value = '';
    }

    document.getElementById('btn-refresh').addEventListener('click', loadAll);
    document.getElementById('btn-ban').addEventListener('click', banIp);
    document.getElementById('btn-unban').addEventListener('click', unbanInput);

    window.unbanSpecific = unbanSpecific;
    loadAll();
  </script>
</body>
</html>
