<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCKS5 客户端边缘中继网关</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0b1120',
              card: '#0f172a',
              line: '#1e293b',
              accent: '#06b6d4'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b1120; color: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="p-3 sm:p-5 custom-scroll min-h-screen text-slate-200">

  <div id="app" class="max-w-7xl mx-auto space-y-4">
    <!-- 顶部常驻导航条: 标题 + TUN 状态胶囊 + 微型 Tab 切换 + 快捷动作 -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-3 p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 shadow-xl backdrop-blur">
      
      <!-- 品牌与标题 -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-xl shadow-inner shadow-cyan-500/20">
          🌐
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-bold text-slate-100">SOCKS5 客户端边缘中继网关</h1>
            <span class="px-1.5 py-0.2 text-[10px] font-semibold rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">NextGen v3.0</span>
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <!-- 全局 TUN 状态胶囊 -->
            <button id="btnGlobalTunPill" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1 transition">
              <span>🛡️</span> 探测中...
            </button>
            <span id="globalSpinner" class="hidden text-[10px] text-cyan-400 font-mono animate-spin">⟳</span>
          </div>
        </div>
      </div>

      <!-- 四大工作区 Tab 导航 -->
      <nav class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800/80 self-start md:self-auto overflow-x-auto max-w-full">
        <button class="nav-tab-btn" data-tab="topology">
          <span>🧭</span> 拓扑管道
        </button>
        <button class="nav-tab-btn" data-tab="selectors">
          <span>🎯</span> 策略组切网
        </button>
        <button class="nav-tab-btn" data-tab="nodes">
          <span>📡</span> 节点工坊
        </button>
        <button class="nav-tab-btn" data-tab="connections">
          <span>📊</span> 实时连接
        </button>
      </nav>

      <!-- 右侧常用快捷按钮 -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <button id="btnGlobalPingAll" class="px-2.5 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 rounded-lg flex items-center gap-1 transition" title="并发测速所有节点">
          ⚡ 测速
        </button>
        <button id="btnQuickAddInbound" class="px-2.5 py-1.5 text-xs font-medium bg-cyan-600/30 hover:bg-cyan-600/40 text-cyan-300 border border-cyan-500/40 rounded-lg flex items-center gap-1 transition">
          + 接入
        </button>
        <button id="btnQuickAddPipe" class="px-2.5 py-1.5 text-xs font-medium bg-indigo-600/30 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/40 rounded-lg flex items-center gap-1 transition">
          + 线路
        </button>
        <button id="btnQuickAddChain" class="px-2.5 py-1.5 text-xs font-medium bg-purple-600/30 hover:bg-purple-600/40 text-purple-300 border border-purple-500/40 rounded-lg flex items-center gap-1 transition">
          + 链式
        </button>
        <button id="btnQuickImport" class="px-2.5 py-1.5 text-xs font-medium bg-emerald-600/30 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/40 rounded-lg flex items-center gap-1 transition">
          📥 导入
        </button>
        <button id="btnGlobalRefresh" class="px-2 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition" title="刷新数据">
          🔄
        </button>
      </div>

    </header>

    <!-- 工作区主体渲染视口 -->
    <main id="mainWorkspaceContainer" class="min-h-[500px]">
      <!-- 动态渲染四大工作区之一 -->
    </main>
  </div>

  <!-- ======================== Slide-over 侧滑抽屉 (替代居中模态框) ======================== -->
  <div id="slideoverBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 hidden transition-opacity duration-300"></div>

  <div id="slideoverDrawer" class="fixed top-0 right-0 bottom-0 w-full sm:w-[500px] md:w-[560px] bg-slate-900 border-l border-slate-700/80 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-out flex flex-col">
    <!-- 抽屉头部 -->
    <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
      <div class="flex items-center gap-2">
        <span id="drawerIcon" class="text-lg">⚙</span>
        <h3 id="drawerTitle" class="text-sm font-bold text-slate-100">配置抽屉</h3>
      </div>
      <button id="drawerCloseBtn" class="text-slate-400 hover:text-slate-200 text-lg p-1 rounded hover:bg-slate-800 transition" title="关闭 (Esc)">
        ✕
      </button>
    </div>

    <!-- 抽屉内容区 (滚动) -->
    <div id="drawerBody" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">
      <!-- 动态挂载表单 -->
    </div>
  </div>

  <!-- 轻量 Toast 浮动提示容器 -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none max-w-sm"></div>

  <!-- 引入模块化 ESM 主脚本 -->
  <script type="module" src="./app.js"></script>
</body>
</html>
