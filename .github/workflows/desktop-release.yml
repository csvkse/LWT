# 桌面端（自包含）构建与发布
# 触发：
#   - 推送 v* 格式 tag（如 v0.1.0）→ 构建全平台并自动创建 GitHub Release
#   - 面板手动触发 → 可选平台 / 可选版本号（填了版本号才会创建 Release）
# 产物：自包含发布（目标机无需安装 .NET 运行时），解压即用

name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号（如 v0.1.0）—— 留空则只构建不发布"
        required: false
        type: string
      platform:
        description: "构建平台（手动触发时）"
        required: true
        default: "linux-x64"
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - win-x64
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          FULL_MATRIX='{"include":[{"os":"ubuntu-latest","rid":"linux-x64","ext":"tar.gz"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","ext":"tar.gz"},{"os":"windows-latest","rid":"win-x64","ext":"zip"}]}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platform }}" != "all" ]; then
            case "${{ inputs.platform }}" in
              linux-x64)  echo 'matrix={"include":[{"os":"ubuntu-latest","rid":"linux-x64","ext":"tar.gz"}]}' >> $GITHUB_OUTPUT ;;
              linux-arm64) echo 'matrix={"include":[{"os":"ubuntu-24.04-arm","rid":"linux-arm64","ext":"tar.gz"}]}' >> $GITHUB_OUTPUT ;;
              win-x64)    echo 'matrix={"include":[{"os":"windows-latest","rid":"win-x64","ext":"zip"}]}' >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "matrix=${FULL_MATRIX}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node (前端门禁)
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Frontend Gate (前端架构门禁)
        run: node src/LinuxWebTool.WebHost/wwwroot/frontend-gate.cjs

      - name: Publish (self-contained ${{ matrix.rid }})
        run: >
          dotnet publish src/LinuxWebTool.WebHost/LinuxWebTool.WebHost.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish
          --nologo
          /p:DebugSymbols=false
          /p:DebugType=None

      - name: Bundle 运行脚本与部署文件
        shell: bash
        run: |
          cp README.md publish/
          cp src/LinuxWebTool.WebHost/Deploy/linuxwebtool.service publish/
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexec ./LinuxWebTool.WebHost "$@"\n' > publish/start.sh
            chmod +x publish/start.sh
          else
            printf '@echo off\ncd /d %%~dp0\nLinuxWebTool.WebHost.exe\n' > publish/start.bat
          fi

      - name: Archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: tar -czf linuxwebtool-${{ matrix.rid }}.tar.gz -C publish .

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath linuxwebtool-${{ matrix.rid }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxwebtool-${{ matrix.rid }}
          path: linuxwebtool-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            🎉 **LinuxWebTool 桌面端（自包含）发布**

            各平台压缩包为**自包含发布**，目标机**无需安装 .NET 运行时**，解压即可运行。

            ### 📦 下载与运行

            * **🐧 Linux x64 / ARM64**：
                * 下载 `linuxwebtool-linux-*.tar.gz`，解压后执行 `./start.sh`（或 `./LinuxWebTool.WebHost`）。
                * 系统服务：使用包内 `linuxwebtool.service` 注册 systemd。
            * **🪟 Windows x64**：
                * 下载 `linuxwebtool-win-x64.zip`，解压后双击 `start.bat`（或 `LinuxWebTool.WebHost.exe`）。

            ### 🔑 首次启动

            * 管理员口令自动生成：见程序日志，或 `data/admin.json`；
            * 也可用环境变量注入：`Admin__UserName` / `Admin__Password`。

            ### ⚠️ 安全提示

            本工具可在网页上远程执行 shell，请仅部署于内网/本机，勿暴露公网。

            ---
            *💡 详细代码更新日志见下方自动生成的 Release Notes 👇*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
