name: Native AOT

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Native AOT image
        run: docker build --pull --tag linuxwebtool:aot .
      - name: Verify architecture gates
        run: dotnet test LinuxWebTool.slnx -c Release --nologo
      - name: Verify all API routes in AOT container
        shell: pwsh
        run: ./scripts/smoke-aot.ps1 -ImageTag linuxwebtool:aot
