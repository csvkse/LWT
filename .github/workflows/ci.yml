# LinuxWebTool CI
# 触发：push 到 main / PR / 手动（workflow_dispatch）
# 流程：后端构建 + 架构门禁测试 + 前端架构门禁 → Docker 镜像构建（main 推送时发布到 GHCR）
# 与本地 scripts/verify-fast.ps1 门禁体系对应

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node (前端门禁)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Restore & Build
        run: dotnet build LinuxWebTool.slnx -c Release --nologo

      - name: Architecture Tests (后端架构门禁)
        run: dotnet test tests/LinuxWebTool.ArchitectureTests/LinuxWebTool.ArchitectureTests.csproj -c Release --no-build --nologo

      - name: Frontend Gate (前端架构门禁)
        run: node src/LinuxWebTool.WebHost/wwwroot/frontend-gate.cjs

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    strategy:
      # 按 GPU 厂商分 tag：每档只含所需 VA 驱动（见 Dockerfile 的 VENDOR 层）。
      # latest = all 兜底（原行为）；latest-intel/amd/nv 为按需驱动档，体积更小。
      matrix:
        include:
          - vendor: all
            tag: latest
          - vendor: intel
            tag: latest-intel
          - vendor: amd
            tag: latest-amd
          - vendor: nv
            tag: latest-nv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-

      - name: Build & Push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VENDOR=${{ matrix.vendor }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.vendor }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
