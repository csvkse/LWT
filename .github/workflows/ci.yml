# LinuxWebTool CI
# 触发：push 到 main / PR / 手动（workflow_dispatch）
# 流程：后端构建 + 架构门禁测试 + 前端架构门禁 → Docker 镜像构建（main 推送时发布到 GHCR）
# 与本地 scripts/verify-fast.ps1 门禁体系对应

name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node (前端门禁)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore & Build
        run: dotnet build LinuxWebTool.slnx -c Release --nologo

      - name: Architecture Tests (后端架构门禁)
        run: dotnet test tests/LinuxWebTool.ArchitectureTests/LinuxWebTool.ArchitectureTests.csproj -c Release --no-build --nologo --logger trx --results-directory artifacts/architecture

      - name: Whitebox Unit Tests (单元测试与覆盖率)
        run: dotnet test tests/LinuxWebTool.UnitTests/LinuxWebTool.UnitTests.csproj -c Release --no-build --nologo --collect:"XPlat Code Coverage" --logger trx --results-directory artifacts/unittests

      - name: API Integration Tests (后端接口集成门禁)
        run: dotnet test tests/LinuxWebTool.IntegrationTests/LinuxWebTool.IntegrationTests.csproj -c Release --no-build --nologo --filter 'Category!=External' --logger trx --results-directory artifacts/integration

      - name: Frontend Gate (前端架构门禁)
        run: node src/LinuxWebTool.WebHost/wwwroot/frontend-gate.cjs

      - name: Frontend Unit Tests (前端单元测试)
        run: node --experimental-vm-modules --test tests/frontend/*.test.mjs

      - name: Smoke harness regression tests
        run: node --test tests/smoke/http-contract.test.mjs tests/smoke/performance.test.mjs

      - name: Test and Coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitebox-reports
          path: artifacts/

  docker-build:
    name: Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 (原生 ubuntu-latest) - 包含全量 Intel + Mesa 驱动与 NVENC 透传支持
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          # ARM64 (原生 ARM64 物理机 ubuntu-24.04-arm，零 QEMU 模拟) - 包含 Mesa 驱动与 NVENC 透传支持
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser smoke dependencies (amd64 only)
        if: matrix.arch == 'amd64'
        working-directory: tests/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像仓库名必须全小写；github.repository 可能是大写（如 csvkse/LWT），
      # Docker 直接用它作 tag 会报 "repository name must be lowercase"。这里统一转小写。
      - name: Lowercase repo
        id: repo
        run: echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build candidate for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VENDOR=all
          load: true
          push: false
          tags: ghcr.io/${{ steps.repo.outputs.repo_lower }}:test-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Blackbox API, browser and PTY gates (amd64)
        if: matrix.arch == 'amd64'
        env:
          SMOKE_TARGET: container-amd64
        shell: pwsh
        run: ./scripts/smoke-aot.ps1 -ImageTag 'ghcr.io/${{ steps.repo.outputs.repo_lower }}:test-${{ matrix.arch }}' -Browser -Terminal

      - name: Blackbox API and PTY gates (arm64)
        if: matrix.arch == 'arm64'
        env:
          SMOKE_TARGET: container-arm64
        shell: pwsh
        run: ./scripts/smoke-aot.ps1 -ImageTag 'ghcr.io/${{ steps.repo.outputs.repo_lower }}:test-${{ matrix.arch }}' -Terminal

      - name: Push arch-specific image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          REPO="ghcr.io/${{ steps.repo.outputs.repo_lower }}"
          IMAGE="${REPO}:sha-${{ github.sha }}-${{ matrix.arch }}"
          docker tag "${REPO}:test-${{ matrix.arch }}" "${IMAGE}"
          docker push "${IMAGE}"

      - name: Blackbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-${{ matrix.arch }}
          path: |
            artifacts/smoke/
            tests/smoke/playwright-report/
            tests/smoke/test-results/

  manifest:
    name: Publish Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifests
        run: |
          REPO="ghcr.io/${{ steps.repo.outputs.repo_lower }}"
          AMD_IMG="${REPO}:sha-${{ github.sha }}-amd64"
          ARM_IMG="${REPO}:sha-${{ github.sha }}-arm64"
          
          # 标准多架构标签 + 厂商兼容别名标签（全部指向统一全功能镜像）
          TARGET_TAGS=(
            "${REPO}:latest"
            "${REPO}:sha-${{ github.sha }}"
            "${REPO}:latest-intel"
            "${REPO}:latest-amd"
            "${REPO}:latest-nv"
            "${REPO}:sha-${{ github.sha }}-all"
            "${REPO}:sha-${{ github.sha }}-intel"
            "${REPO}:sha-${{ github.sha }}-amd"
            "${REPO}:sha-${{ github.sha }}-nv"
          )
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_TAGS+=(
              "${REPO}:${{ github.ref_name }}"
              "${REPO}:${{ github.ref_name }}-intel"
              "${REPO}:${{ github.ref_name }}-amd"
              "${REPO}:${{ github.ref_name }}-nv"
            )
          fi
          
          TAG_ARGS=()
          for T in "${TARGET_TAGS[@]}"; do
            TAG_ARGS+=("-t" "$T")
          done
          
          echo "Creating unified multi-arch manifest with all vendor compatibility tag aliases:"
          echo "  Images: ${AMD_IMG} and ${ARM_IMG}"
          echo "  Tags: ${TARGET_TAGS[*]}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${AMD_IMG}" "${ARM_IMG}"

      - name: Inspect latest multi-arch manifest
        run: |
          REPO="ghcr.io/${{ steps.repo.outputs.repo_lower }}"
          docker buildx imagetools inspect "${REPO}:latest"
