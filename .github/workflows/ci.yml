# LinuxWebTool CI
# 触发：push 到 main / PR / 手动（workflow_dispatch）
# 流程：后端构建 + 架构门禁测试 + 前端架构门禁 → Docker 镜像构建（main 推送时发布到 GHCR）
# 与本地 scripts/verify-fast.ps1 门禁体系对应

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node (前端门禁)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore & Build
        run: dotnet build LinuxWebTool.slnx -c Release --nologo

      - name: Architecture Tests (后端架构门禁)
        run: dotnet test tests/LinuxWebTool.ArchitectureTests/LinuxWebTool.ArchitectureTests.csproj -c Release --no-build --nologo --logger trx --results-directory artifacts/architecture

      - name: API Integration Tests (后端接口集成门禁)
        run: dotnet test tests/LinuxWebTool.IntegrationTests/LinuxWebTool.IntegrationTests.csproj -c Release --no-build --nologo --filter 'Category!=External' --logger trx --results-directory artifacts/integration

      - name: Frontend Gate (前端架构门禁)
        run: node src/LinuxWebTool.WebHost/wwwroot/frontend-gate.cjs

      - name: Smoke harness regression tests
        run: node --test tests/smoke/http-contract.test.mjs tests/smoke/performance.test.mjs

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitebox-reports
          path: artifacts/

  docker:
    name: Docker Image (${{ matrix.vendor }})
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # 按 GPU 厂商分 tag：每档只含所需 VA 驱动（见 Dockerfile 的 VENDOR 层）。
      # latest = all 兜底（原行为）；latest-intel/amd/nv 为按需驱动档，体积更小。
      matrix:
        include:
          - vendor: all
            tag: latest
          - vendor: intel
            tag: latest-intel
          - vendor: amd
            tag: latest-amd
          - vendor: nv
            tag: latest-nv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser smoke dependencies
        working-directory: tests/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像仓库名必须全小写；github.repository 可能是大写（如 csvkse/LWT），
      # Docker 直接用它作 tag 会报 "repository name must be lowercase"。这里统一转小写。
      - name: Lowercase repo
        id: repo
        run: echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repo_lower }}
          tags: |
            type=sha,prefix=sha-

      - name: Build candidate (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VENDOR=${{ matrix.vendor }}
          load: true
          push: false
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lower }}:${{ matrix.tag }}
            ghcr.io/${{ steps.repo.outputs.repo_lower }}:sha-${{ github.sha }}-${{ matrix.vendor }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Blackbox API, browser and PTY gates
        env:
          SMOKE_TARGET: container-${{ matrix.vendor }}
        shell: pwsh
        run: ./scripts/smoke-aot.ps1 -ImageTag 'ghcr.io/${{ steps.repo.outputs.repo_lower }}:sha-${{ github.sha }}-${{ matrix.vendor }}' -Browser -Terminal

      - name: Publish tested candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.repo_lower }}:sha-${{ github.sha }}-${{ matrix.vendor }}
          docker push ghcr.io/${{ steps.repo.outputs.repo_lower }}:${{ matrix.tag }}

      - name: Blackbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-${{ matrix.vendor }}
          path: |
            artifacts/smoke/
            tests/smoke/playwright-report/
            tests/smoke/test-results/
